site_name: Puget Mesh
site_author: Puget Mesh
site_description: "Puget Mesh: Supporting Mesh networks in the Puget Sound Region"
copyright: © Creative Commons Attribution-ShareAlike 4.0 International License
site_url: https://pugetmesh.org
repo_url: https://github.com/pugetmesh/pugetmesh.github.io
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - MeshCore:
    - Overview: meshcore/index.md
    - Equipment: meshcore/equipment.md
    - Repeater Setup: meshcore/repeater_setup.md
    - RF Bridge & Backhaul: meshcore/rf_bridge.md
    - Backhaul Testing:
      - Overview: meshcore/backhaul/index.md
      - Test1 — 500 kHz trial: meshcore/backhaul/test1.md
      - Test2 — Spectrum test: meshcore/backhaul/test2.md
      - Test3 — Freq/SF/CR: meshcore/backhaul/test3.md
  - AREDN:
    - Overview: aredn/index.md
    - Getting Started: aredn/getting_started.md
    - Equipment: aredn/equipment.md
    - HaLow (802.11ah): aredn/halow.md
    - Coverage & Map: aredn/map.md
  - Meshtastic:
    - Overview: meshtastic/index.md
    - FAQ: meshtastic/faq.md
    - Configuration: meshtastic/config.md
    - Equipment: meshtastic/equipment.md
    - May 2025 - ShortFast Experiment: meshtastic/may2025.md
  - About: about.md
  - Other: other.md

plugins:
  - search
  - social
  - table-reader
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
  - git-committers:
      repository: pugetmesh/pugetmesh.github.io
      branch: main

markdown_extensions:
  - toc
  - attr_list
  - md_in_html
  - tables
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: amber
    scheme: default 

  favicon: static/favicon.png
  logo: static/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - toc.integrate
    - toc.follow
    - content.action.edit
    - content.code.copy

extra_javascript:
  - static/mesh_background.js

extra_css:
  - static/mesh_background.css

extra:
  social:
    - icon: fontawesome/brands/discord 
      link: https://discord.gg/ANvUg3AyZt
    - icon: fontawesome/brands/bluesky 
      link: https://bsky.app/profile/pugetmesh.org
    - icon: fontawesome/brands/instagram 
      link: https://www.instagram.com/pugetmesh
    - icon: fontawesome/brands/github 
      link: https://github.com/pugetmesh
